name: Daily Gold Article Bot

on:
  schedule:
    # المقال الأول: 08:00 صباحاً بتوقيت القاهرة الشتوي (06:00 UTC)
    - cron: '0 6 * * *'
    # المقال الثاني: 04:00 عصراً بتوقيت القاهرة الشتوي (14:00 UTC)
    - cron: '0 14 * * *'
  workflow_dispatch:

jobs:
  publish-article:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run Gold Article Bot
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: node bot.js
