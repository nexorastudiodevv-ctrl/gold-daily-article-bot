name: Daily Gold Article Bot

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  publish-article:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Arabic Fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-hosny-amiri fonts-noto-core fontconfig
          fc-cache -f
          fc-list | grep -i amiri | head -n 3

      - name: Install Image Generator
        run: npm install sharp

      - name: Run Gold Article Bot
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SITE_API_URL: ${{ secrets.SITE_API_URL }}
          SITE_API_SECRET: ${{ secrets.SITE_API_SECRET }}
        run: node bot.js
